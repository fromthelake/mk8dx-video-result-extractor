[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mk8dx-video-result-extractor"
version = "0.1.0"
description = "Extract Mario Kart 8 local-play result screens from videos and export tournament results to Excel."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
  { name = "Project Maintainer" }
]
dependencies = [
  # PyTorch is handled outside this direct dependency list. Windows setup
  # installs the official CUDA wheel explicitly; Linux/macOS environments may
  # need their platform-specific PyTorch wheel. Keeping plain "torch" out of
  # this list avoids pip selecting an unintended CPU-only wheel.
  "easyocr==1.7.2",
  "et_xmlfile==2.0.0",
  "jellyfish==1.1.3",
  "numpy==2.2.1",
  "opencv-python==4.10.0.84",
  "openpyxl==3.1.5",
  "packaging==24.2",
  "pandas==2.2.3",
  "pillow==11.0.0",
  "psutil==7.2.1",
  "python-dateutil==2.9.0.post0",
  "pytz==2024.2",
  "six==1.17.0",
  "textdistance==4.6.2",
  "tzdata==2024.2",
]

[project.scripts]
mk8-local-play = "mk8dx_video_result_extractor.main:main"
mk8dx-video-result-extractor = "mk8dx_video_result_extractor.main:main"

[tool.setuptools.packages.find]
include = ["mk8dx_video_result_extractor", "mk8dx_video_result_extractor_data"]

[tool.setuptools.package-data]
mk8dx_video_result_extractor = [
  "data/mii_allowed_chars.json",
]
mk8dx_video_result_extractor_data = [
  "reference_data/game_catalog.json",
]

